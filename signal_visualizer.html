<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Mercury - Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-glass: rgba(10, 10, 15, 0.6); --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f9fafb; --text-secondary: #a1a1aa; --accent-primary: #aaa;
            --accent-green: #34d399; --accent-red: #fb7185;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1657978837950-03646a7c7b9e?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=2832');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-primary);
        }
        .floating-panel {
            background-color: var(--bg-glass);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid var(--border-color);
            box-shadow: 0 16px 60px 0 rgba(0, 0, 0, 0.5);
        }
        .widget-title {
            font-weight: 500; color: var(--text-secondary); margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;
            font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .sidebar-link.active { color: var(--accent-primary); background-color: rgba(255,255,255,0.05); }
        .ai-chat-bubble { border: 1px solid var(--border-color); background: rgba(30, 41, 59, 0.6); }
        .ai-chat-bubble.user { background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.3); }
        .prose { color: var(--text-primary); }
        .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 { color: var(--text-primary); margin-bottom: 0.5em; margin-top: 1em;}
        .prose strong { color: var(--text-primary); }
        .prose ul { list-style-type: disc; margin-left: 1.5em; }
        .prose p { margin-bottom: 0.5em; }
        .journal-card { border-bottom: 1px solid var(--border-color); }
        /* Styles for Daily Plan Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(3px);
            display: flex; align-items: center; justify-content: center;
            z-index: 50; /* Ensure it's on top */
            opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background-color: var(--bg-glass); border: 1px solid var(--border-color);
            padding: 1.5rem; border-radius: 1rem; max-width: 600px; width: 90%;
            max-height: 80vh; overflow-y: auto;
            transform: scale(0.95); transition: transform 0.3s;
            position: relative; /* Needed for absolute positioning of close button */
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-close-btn {
             position: absolute; top: 1rem; right: 1rem;
             background: rgba(255, 255, 255, 0.1); border-radius: 50%;
             padding: 0.5rem; cursor: pointer; line-height: 1; /* Align SVG better */
        }
         .modal-close-btn:hover { background: rgba(255, 255, 255, 0.2); }
         /* Adjust prose within modal for readability */
         .modal-content .prose { font-size: 0.875rem; }
         .modal-content .prose h3 { margin-top: 0.5em; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-black">

    <div class="w-[95vw] h-[90vh] max-w-screen-2xl flex items-center gap-6">
        <nav class="floating-panel rounded-2xl flex-col items-center py-6 px-3 space-y-6 hidden sm:flex">
            <div class="w-10 h-10 bg-[var(--accent-primary)] rounded-lg flex items-center justify-center font-bold text-black text-xl">M</div>
            <a href="#" id="nav-dashboard" class="sidebar-link active p-3 rounded-lg" title="Dashboard (D)"><svg class="w-6 h-6 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg></a>
            <a href="#" id="nav-positions" class="sidebar-link p-3 text-slate-400 hover:text-white rounded-lg" title="Positions (P)"><svg class="w-6 h-6 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M12 14a3 3 0 100-6 3 3 0 000 6z"></path></svg></a>
            <a href="#" id="nav-history" class="sidebar-link p-3 text-slate-400 hover:text-white rounded-lg" title="Trade History (H)"><svg class="h-6 w-6 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></a>
            <a href="#" id="nav-analytics" class="sidebar-link p-3 text-slate-400 hover:text-white rounded-lg" title="Analytics (A)"><svg class="h-6 w-6 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" /><path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" /></svg></a>
            
            <a href="#" id="nav-mailbox" class="sidebar-link p-3 text-slate-400 hover:text-white rounded-lg" title="Daily Plan (M)">
                 <svg class="h-6 w-6 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
            </a>

            <a href="#" id="nav-journal" class="sidebar-link p-3 text-slate-400 hover:text-white rounded-lg" title="AI Journal (J)">
                <svg class="h-6 w-6 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
            </a>
            
            <a href="#" id="nav-research" class="sidebar-link p-3 text-slate-400 hover:text-white rounded-lg" title="Research (R)"><svg class="h-6 w-6 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.37 3.414-1.414 3.414H4.828c-1.784 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg></a>
        </nav>

        <main class="floating-panel rounded-2xl flex-1 h-full flex flex-col">
            <div id="main-content" class="p-6 overflow-y-auto flex-1">
                </div>
        </main>
        
        <aside class="floating-panel rounded-2xl w-full max-w-md h-full flex-col hidden lg:flex">
             <div class="p-4 border-b border-[var(--border-color)] flex justify-between items-center"><h2 class="text-xl font-semibold text-white">Gemini AI Copilot</h2></div>
             <div id="chat-window" class="flex-1 p-4 space-y-4 overflow-y-auto"></div>
             <div class="p-4 border-t border-[var(--border-color)]"><div class="flex space-x-2"><input type="text" id="chat-input" class="flex-1 bg-slate-800/50 border border-[var(--border-color)] rounded-lg px-4 py-2" placeholder="Type a ticker for a deep dive..."><button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Send</button></div></div>
        </aside>
    </div>

    <div id="daily-plan-modal" class="modal-overlay">
        <div class="modal-content relative">
             <button id="modal-close" class="modal-close-btn">
                 <svg class="w-4 h-4 text-slate-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
             </button>
             <h2 id="modal-title" class="text-xl font-semibold mb-4 text-white">Daily Trade Plan</h2>
             <div id="modal-body" class="prose max-w-none text-sm">
                 <p class="text-slate-400">Loading plan...</p>
             </div>
        </div>
    </div>

<script>
    // --- UTILITY FUNCTIONS ---
    const formatCurrency = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
    const formatPercent = (val) => `${(val * 100).toFixed(2)}%`;
    const formatNumber = (val) => new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val);

    async function fetchData(endpoint, options = {}) {
        try {
            const res = await fetch(endpoint, options);
            if (!res.ok) { 
                const errorData = await res.json().catch(() => ({error: 'Failed to fetch'}));
                throw new Error(errorData.error || `HTTP error! status: ${res.status}`);
            }
            // Handle cases where the response might be empty but successful (e.g., 204 No Content)
            if (res.status === 204) {
                 return null; // Or return an empty object/array as appropriate
            }
            return await res.json();
        } catch (error) {
            console.error(`Fetch error for ${endpoint}:`, error);
            // Display a user-friendly error or re-throw if needed elsewhere
            throw new Error(`Failed to fetch data from ${endpoint}. ${error.message}`);
        }
    }

    // --- TEMPLATES FOR SPA ---
    const panelTemplates = {
        dashboard: `
            <div class="space-y-6">
                <header><h1 class="text-3xl font-bold text-white">Dashboard</h1></header>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-1 space-y-6">
                        <div><h3 class="widget-title">Portfolio Summary</h3><div id="portfolio-summary">Loading...</div></div>
                        <div><h3 class="widget-title">Live Equity Curve</h3><div id="equity-curve-chart" class="w-full h-40">Loading...</div></div>
                    </div>
                    <div class="lg:col-span-2"><h3 class="widget-title">Signal Watchlist</h3><div id="watchlist-grid">Loading...</div></div>
                </div>
            </div>`,
        positions: `<div class="space-y-6"><header><h1 class="text-3xl font-bold text-white">Open Positions</h1></header><div class="overflow-y-auto"><table class="w-full text-left text-sm"><thead class="sticky top-0 bg-[var(--bg-glass)] backdrop-blur-md"><tr><th class="p-3">Symbol</th><th>Qty</th><th>Avg Entry</th><th>Current Price</th><th>Unrealized P/L</th></tr></thead><tbody id="positions-table-body"><tr><td colspan="5" class="p-4 text-center text-slate-400">Loading...</td></tr></tbody></table></div></div>`,
        history: `<div class="space-y-6"><header><h1 class="text-3xl font-bold text-white">Trade History</h1></header><div class="overflow-y-auto"><table class="w-full text-left text-sm"><thead class="sticky top-0 bg-[var(--bg-glass)] backdrop-blur-md"><tr><th class="p-3">Timestamp</th><th>Symbol</th><th>Action</th><th>Qty</th><th>Price</th><th>Type</th></tr></thead><tbody id="history-table-body"><tr><td colspan="6" class="p-4 text-center text-slate-400">Loading...</td></tr></tbody></table></div></div>`,
        analytics: `<div class="space-y-6"><header><h1 class="text-3xl font-bold text-white">Performance Analytics</h1></header><div id="analytics-content">Loading...</div></div>`,
        journal: `
            <div class="space-y-6">
                <header><h1 class="text-3xl font-bold text-white">AI Journal (Post-Trade Analysis)</h1></header>
                <div id="journal-content" class="space-y-4">
                    <p class="text-slate-400 text-center py-4">Loading...</p>
                </div>
            </div>`,
        research: `
            <div class="space-y-6">
                <header><h1 class="text-3xl font-bold text-white">Backtesting & Research</h1></header>
                <div>
                    <h3 class="widget-title">Run New Backtest</h3>
                    <div class="bg-slate-800/20 p-4 rounded-lg grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                        <div>
                            <label for="ticker-select" class="block text-sm font-medium text-slate-300">Ticker</label>
                            <select id="ticker-select" class="mt-1 block w-full bg-slate-700/50 border border-[var(--border-color)] rounded-md py-2 px-3 text-sm">
                                <option>Loading...</option>
                            </select>
                        </div>
                        <div>
                            <label for="strategy-select" class="block text-sm font-medium text-slate-300">Strategy</label>
                            <select id="strategy-select" class="mt-1 block w-full bg-slate-700/50 border border-[var(--border-color)] rounded-md py-2 px-3 text-sm">
                                <option>Loading...</option>
                            </select>
                        </div>
                        <button id="run-backtest-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg h-10">Run</button>
                    </div>
                </div>
                <div><h3 class="widget-title">Backtest History</h3><div class="overflow-y-auto"><table class="w-full text-left text-sm"><thead class="sticky top-0 bg-[var(--bg-glass)] backdrop-blur-md"><tr><th class="p-3">Strategy</th><th>Ticker</th><th>Sharpe</th><th>CAGR</th><th>Max Drawdown</th><th>Timestamp</th><th>Report</th></tr></thead><tbody id="backtest-results-body"><tr><td colspan="7" class="p-4 text-center text-slate-400">Loading...</td></tr></tbody></table></div></div>
            </div>`
    };

    const mainContent = document.getElementById('main-content');
    let equityChart = null;

    // --- RENDER FUNCTIONS (FULLY IMPLEMENTED) ---
    function renderPortfolioSummary(element, data) {
        if (!data || data.error) {
             element.innerHTML = `<p class="text-red-400 text-center py-4">Error: ${data?.error || 'Could not load portfolio.'}</p>`;
             return;
        }
        const totalPL = data.positions.reduce((acc, p) => acc + parseFloat(p.unrealized_pl), 0);
        element.innerHTML = `<div class="space-y-2 text-sm">
            <div class="flex justify-between items-baseline"><span class="text-slate-400">Equity</span><span class="font-mono text-lg">${formatCurrency(data.portfolio_value)}</span></div>
            <div class="flex justify-between items-baseline"><span class="text-slate-400">Cash</span><span class="font-mono text-lg">${formatCurrency(data.cash)}</span></div>
            <div class="flex justify-between items-baseline"><span class="text-slate-400">Positions</span><span class="font-mono text-lg">${data.positions.length}</span></div>
            <div class="flex justify-between items-baseline"><span class="text-slate-400">Today's P/L</span><span class="font-mono text-lg ${totalPL >= 0 ? 'text-[color:var(--accent-green)]' : 'text-[color:var(--accent-red)]'}">${formatCurrency(totalPL)}</span></div>
        </div>`;
    }
    
    function renderEquityCurve(element, data) {
         if (!data || data.error) {
             element.innerHTML = `<p class="text-amber-400 text-center py-4">${data?.error || 'Could not load equity curve.'}</p>`;
             return;
        }
        if (equityChart) equityChart.remove(); // Remove previous chart instance
        element.innerHTML = ''; // Clear loading/error message

        if (!Array.isArray(data) || data.length === 0) {
            element.innerHTML = `<p class="text-slate-400 text-center py-4">No equity history data available.</p>`;
            return;
        }

        try {
            equityChart = LightweightCharts.createChart(element, { 
                width: element.clientWidth, 
                height: 160, 
                layout: { background: { type: 'solid', color: 'transparent' }, textColor: 'var(--text-primary)' }, 
                grid: { vertLines: { visible: false }, horzLines: { color: 'rgba(255, 255, 255, 0.1)' } },
                timeScale: { borderVisible: false },
                rightPriceScale: { borderVisible: false } 
            });
            const lineSeries = equityChart.addLineSeries({ color: 'var(--accent-primary)', lineWidth: 2 });
            // Ensure data is correctly formatted {time: 'YYYY-MM-DD', value: number}
            const formattedData = data.map(item => ({
                time: item.time, // Assuming 'time' is already 'YYYY-MM-DD'
                value: parseFloat(item.value) 
            })).sort((a, b) => new Date(a.time) - new Date(b.time)); // Sort just in case

            lineSeries.setData(formattedData);
            equityChart.timeScale().fitContent();
        } catch (chartError) {
             console.error("Error creating equity chart:", chartError);
             element.innerHTML = `<p class="text-red-400 text-center py-4">Error rendering chart.</p>`;
        }
    }


    function renderWatchlist(element, data) {
         if (!data || data.error) {
             element.innerHTML = `<p class="text-red-400 text-center py-4">Error: ${data?.error || 'Could not load watchlist.'}</p>`;
             return;
        }
        if (!Array.isArray(data) || data.length === 0) {
            element.innerHTML = `<div class="text-center p-4 rounded-lg bg-slate-800/30"><p>No signals generated for today.</p></div>`;
            return;
        }
        element.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">${data.map(item => `
            <div class="bg-slate-800/20 border border-[var(--border-color)] p-3 rounded-lg">
                <div class="flex justify-between items-center"><h3 class="font-bold">${item.ticker}</h3><span class="font-mono text-sm">${formatCurrency(item.last_close || 0)}</span></div>
                <div class="mt-3 flex justify-between items-center text-xs">
                    <span class="font-semibold ${item.sentiment_label === 'Positive' ? 'text-[color:var(--accent-green)]' : item.sentiment_label === 'Negative' ? 'text-[color:var(--accent-red)]' : 'text-gray-400'}">${item.sentiment_label || 'Neutral'}</span>
                    <span class="font-bold px-2 py-1 rounded-md ${item.live_signal?.includes('BUY') ? 'bg-green-600/80 text-white' : item.live_signal?.includes('SELL') ? 'bg-red-600/80 text-white' : 'bg-slate-700/80 text-gray-300'}">${(item.live_signal || 'NONE').replace('_', ' ')}</span>
                </div>
            </div>`).join('')}</div>`;
    }

    function renderPositions(element, data) {
         if (!data || data.error) {
             element.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-400">Error: ${data?.error || 'Could not load positions.'}</td></tr>`;
             return;
        }
        if (!Array.isArray(data) || data.length === 0) {
            element.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No open positions.</td></tr>`;
            return;
        }
        element.innerHTML = data.map(p => {
            const pnl = parseFloat(p.unrealized_pl);
            return `<tr class="border-b border-[var(--border-color)] hover:bg-slate-800/10">
                <td class="p-3 font-bold">${p.symbol}</td><td class="p-3 font-mono">${formatNumber(p.qty)}</td>
                <td class="p-3 font-mono">${formatCurrency(p.avg_entry_price)}</td><td class="p-3 font-mono">${formatCurrency(p.current_price)}</td>
                <td class="p-3 font-mono ${pnl >= 0 ? 'text-[color:var(--accent-green)]' : 'text-[color:var(--accent-red)]'}">${formatCurrency(pnl)}</td></tr>`;
        }).join('');
    }

    function renderHistory(element, trades) {
         if (!trades || trades.error) {
             element.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-400">Error: ${trades?.error || 'Could not load trade history.'}</td></tr>`;
             return;
        }
        if (!Array.isArray(trades) || trades.length === 0) {
            element.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">No trade history found.</td></tr>`;
            return;
        }
        element.innerHTML = trades.map(t => `<tr class="border-b border-[var(--border-color)] hover:bg-slate-800/10">
            <td class="p-3 font-mono text-xs">${new Date(t.timestamp).toLocaleString()}</td><td class="p-3 font-bold">${t.ticker}</td>
            <td class="p-3 ${t.action === 'BUY' ? 'text-[color:var(--accent-green)]' : 'text-[color:var(--accent-red)]'}">${t.action}</td><td class="p-3 font-mono">${formatNumber(t.quantity)}</td>
            <td class="p-3 font-mono">${formatCurrency(t.price)}</td><td class="p-3 text-slate-400">${t.trade_type}</td></tr>`).join('');
    }

    function renderAnalytics(element, stats) {
        if (!stats) {
             element.innerHTML = `<p class="text-red-400 text-center py-4">Error: Could not load analytics data.</p>`;
             return;
        }
        if (stats.error) {
             element.innerHTML = `<div class="grid grid-cols-1"><p class="text-center text-amber-400 p-4">${stats.error}</p></div>`;
             return;
        }
        element.innerHTML = `<div class="grid grid-cols-2 md:grid-cols-3 gap-4">${Object.entries(stats).map(([key, value]) => {
            const formattedKey = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            let formattedValue;
            if (value === null || value === undefined) {
                 formattedValue = 'N/A';
            } else if (['net_pnl','avg_win','avg_loss','max_drawdown'].includes(key)) { formattedValue = formatCurrency(value); }
            else if (key.includes('rate') || key.includes('cagr')) { formattedValue = formatPercent(value); }
            else { formattedValue = formatNumber(value); } // Includes Sharpe Ratio now
            const valueColor = key === 'net_pnl' ? (value >= 0 ? 'text-[color:var(--accent-green)]' : 'text-[color:var(--accent-red)]') : '';
            return `<div class="bg-slate-800/30 p-4 rounded-lg"><p class="text-sm text-slate-400">${formattedKey}</p><p class="text-2xl font-bold font-mono ${valueColor}">${formattedValue}</p></div>`;
        }).join('')}</div>`;
    }
    
    function renderBacktestResults(element, results) {
         if (!results || results.error) {
             element.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-red-400">Error: ${results?.error || 'Could not load backtest results.'}</td></tr>`;
             return;
        }
        if (!Array.isArray(results) || results.length === 0) {
            element.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400">No backtest results yet.</td></tr>`;
            return;
        }
        element.innerHTML = results.map(r => `
            <tr class="border-b border-[var(--border-color)] hover:bg-slate-800/10">
                <td class="p-3 font-bold">${r.strategy_name}</td>
                <td class="p-3 font-mono text-slate-300">${r.ticker || 'N/A'}</td>
                <td class="font-mono ${r.sharpe_ratio > 1 ? 'text-[color:var(--accent-green)]' : 'text-slate-300'}">${formatNumber(r.sharpe_ratio)}</td>
                <td class="font-mono">${formatPercent(r.cagr)}</td>
                <td class="font-mono text-[color:var(--accent-red)]">${formatPercent(r.max_drawdown)}</td>
                <td class="font-mono text-xs text-slate-400">${new Date(r.timestamp).toLocaleString()}</td>
                <td><a href="/${r.report_url}" target="_blank" class="text-sm text-blue-400 hover:underline">View Report</a></td>
            </tr>
        `).join('');
    }

    function renderAiJournal(element, entries) {
         if (!entries || entries.error) {
             element.innerHTML = `<p class="text-red-400 text-center py-4">Error: ${entries?.error || 'Could not load AI Journal.'}</p>`;
             return;
        }
        if (!Array.isArray(entries) || entries.length === 0) {
            element.innerHTML = `<div class="text-center p-4 rounded-lg bg-slate-800/30"><p>No AI critiques found yet. Run the post-trade analysis task.</p></div>`;
            return;
        }
        element.innerHTML = entries.map(entry => {
            const pnl = parseFloat(entry.pnl);
            const pnlColor = pnl >= 0 ? 'text-[color:var(--accent-green)]' : 'text-[color:var(--accent-red)]';
            const actionColor = entry.action === 'BUY' ? 'text-[color:var(--accent-green)]' : 'text-[color:var(--accent-red)]';
            
            return `
            <div class="journal-card p-4">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-bold text-lg">${entry.ticker}</span>
                    <span class="font-mono ${pnlColor}">${formatCurrency(pnl)}</span>
                </div>
                <div class="text-xs text-slate-400 mb-3 font-mono">
                    ${new Date(entry.timestamp).toLocaleString()} | 
                    <span class="${actionColor}">${entry.action}</span>
                </div>
                <div class="text-sm space-y-2">
                    <p><strong class="text-slate-400">Reason:</strong> ${entry.reason}</p>
                    <p><strong class="text-slate-400">AI Critique:</strong> <span class="text-slate-200">${entry.critique}</span></p>
                </div>
            </div>
            `;
        }).join('');
    }
    
    // --- Helper function to populate select dropdowns ---
    function populateSelect(selectId, optionsList) {
        const select = document.getElementById(selectId);
        if (!select) return;
        select.innerHTML = ''; // Clear "Loading..."
        if (!Array.isArray(optionsList) || optionsList.length === 0) {
            select.innerHTML = '<option>None found</option>';
            return;
        }
        optionsList.forEach(option => {
            const el = document.createElement('option');
            el.value = option;
            el.textContent = option;
            select.appendChild(el);
        });
    }

    // --- Function to handle running a backtest ---
    async function handleRunBacktest() {
        const tickerSelect = document.getElementById('ticker-select');
        const strategySelect = document.getElementById('strategy-select');
        const btn = document.getElementById('run-backtest-btn');
        
        const ticker = tickerSelect ? tickerSelect.value : null;
        const strategy = strategySelect ? strategySelect.value : null;

        if (!ticker || !strategy || ticker === 'None found' || strategy === 'None found' || ticker === 'Loading...' || strategy === 'Loading...') {
            alert("Please select a valid ticker and strategy.");
            return;
        }
        
        if (btn) {
             btn.disabled = true;
             btn.textContent = 'Running...';
        }
        
        try {
            const response = await fetchData('/api/research/run_backtest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    ticker: ticker,
                    strategy_name: strategy,
                    params: {} // Note: Sending custom params requires UI changes
                })
            });
            alert(response.status || 'Backtest submitted.'); // Provide feedback
            
            // Refresh results after a delay
            setTimeout(() => {
                 fetchAndRender('backtest-results-body', '/api/research/backtest_results', renderBacktestResults);
            }, 5000); // Increased delay to 5 seconds
            
        } catch (error) {
            alert(`Error submitting backtest: ${error.message}`);
        } finally {
             if (btn) {
                btn.disabled = false;
                btn.textContent = 'Run';
             }
        }
    }

    // --- AI CHATBOT ---
    const chatWindow = document.getElementById('chat-window');
    const chatInput = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-button');

    function addMessageToChat(content, isUser = false) {
        if (!chatWindow) return; // Add check
        const bubble = document.createElement('div');
        bubble.className = `ai-chat-bubble p-3 rounded-lg max-w-full break-words ${isUser ? 'user ml-auto' : ''}`; // Added ml-auto for user
        bubble.innerHTML = isUser ? `<p class="text-white text-right">${content}</p>` : marked.parse(content);
        chatWindow.appendChild(bubble);
        chatWindow.scrollTop = chatWindow.scrollHeight; // Scroll to bottom
    }

    async function handleSendMessage() {
        if (!chatInput) return; // Add check
        const message = chatInput.value.trim();
        if (!message) return;
        addMessageToChat(message, true);
        chatInput.value = '';
        addMessageToChat('<div class="italic text-slate-400">Gemini is thinking...</div>');
        try {
            const response = await fetchData('/api/ai/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
            if (chatWindow.lastChild && chatWindow.lastChild.textContent.includes('thinking...')) {
                 chatWindow.removeChild(chatWindow.lastChild); // Remove thinking message
            }
            addMessageToChat(response.reply || "No reply received.");
        } catch (error) {
             if (chatWindow.lastChild && chatWindow.lastChild.textContent.includes('thinking...')) {
                 chatWindow.removeChild(chatWindow.lastChild); // Remove thinking message
            }
            addMessageToChat(`<div class="text-red-400">Error: ${error.message}</div>`);
        }
    }
    
    // --- Helper for API calls ---
    async function fetchAndRender(elementId, endpoint, renderer) {
        const element = document.getElementById(elementId);
        if (!element) {
            console.error(`Element with ID ${elementId} not found.`);
            return;
        }
        // Keep existing loading message if present
        // element.innerHTML = '<p class="text-slate-400 text-center py-4">Loading...</p>';
        try {
            const data = await fetchData(endpoint);
            renderer(element, data);
        } catch (error) {
            // Display error in the specific element
            renderer(element, { error: error.message });
        }
    }

    // --- Daily Plan Modal Logic ---
    const dailyPlanModal = document.getElementById('daily-plan-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const modalCloseBtn = document.getElementById('modal-close');

    async function showDailyPlan() {
        if (!dailyPlanModal || !modalTitle || !modalBody) return; // Add checks
        modalTitle.textContent = "Daily Trade Plan";
        modalBody.innerHTML = '<p class="text-slate-400">Loading plan...</p>';
        dailyPlanModal.classList.add('active');

        try {
            const planData = await fetchData('/api/latest_daily_plan');
            modalTitle.textContent = planData.subject || "Daily Trade Plan";
            modalBody.innerHTML = marked.parse(planData.content || "No content available.");
        } catch (error) {
            modalBody.innerHTML = `<p class="text-red-400">Error loading plan: ${error.message}</p>`;
        }
    }

    function closeDailyPlan() {
        if (!dailyPlanModal) return; // Add check
        dailyPlanModal.classList.remove('active');
    }

    // --- Panel Loading Logic ---
    let researchPanelListener = null; // Store listener to remove it later

    function loadPanel(panelName) {
        if (!panelTemplates[panelName]) {
             console.error(`Template for panel "${panelName}" not found.`);
             mainContent.innerHTML = `<p class="text-red-400 text-center py-4">Error: Panel template not found.</p>`;
             return;
        }
        
        // --- Remove previous panel-specific listeners ---
        if (researchPanelListener) {
            mainContent.removeEventListener('click', researchPanelListener);
            researchPanelListener = null;
        }
        // Add more removals here if other panels add listeners directly to mainContent

        mainContent.innerHTML = panelTemplates[panelName]; // Load new template

        // Fetch data based on the loaded panel
        if (panelName === 'dashboard') {
            fetchAndRender('portfolio-summary', '/api/portfolio_status', renderPortfolioSummary);
            fetchAndRender('equity-curve-chart', '/api/equity_curve', renderEquityCurve);
            fetchAndRender('watchlist-grid', '/api/dashboard_data', renderWatchlist);

        } else if (panelName === 'positions') {
             fetchAndRender('positions-table-body', '/api/portfolio_status', (elem, data) => renderPositions(elem, data.positions));

        } else if (panelName === 'history') {
             fetchAndRender('history-table-body', '/api/trade_history', renderHistory);

        } else if (panelName === 'analytics') {
             fetchAndRender('analytics-content', '/api/performance_stats', renderAnalytics);

        } else if (panelName === 'journal') {
            fetchAndRender('journal-content', '/api/ai_journal', renderAiJournal);

        } else if (panelName === 'research') {
            fetchAndRender('backtest-results-body', '/api/research/backtest_results', renderBacktestResults);
            // Use .catch for better error handling on dropdown fetches
            fetchData('/api/research/available_tickers')
                .then(tickers => populateSelect('ticker-select', tickers))
                .catch(err => {
                     console.error("Failed to load tickers:", err);
                     populateSelect('ticker-select', []); // Show "None found" on error
                });
            fetchData('/api/research/available_strategies')
                 .then(strategies => populateSelect('strategy-select', strategies))
                 .catch(err => {
                     console.error("Failed to load strategies:", err);
                     populateSelect('strategy-select', []); // Show "None found" on error
                });

            // Define and add listener specific to this panel load
            researchPanelListener = function(e) {
                if (e.target && e.target.id === 'run-backtest-btn') {
                    handleRunBacktest();
                }
            };
            mainContent.addEventListener('click', researchPanelListener);
        }
    }

    // --- MAIN INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        // Sidebar link handling
        document.querySelectorAll('.sidebar-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const clickedLink = e.target.closest('.sidebar-link');
                if (!clickedLink) return;

                if (clickedLink.id === 'nav-mailbox') {
                    showDailyPlan();
                    // Optional: Deactivate other links if needed, but don't change main panel
                    document.querySelectorAll('.sidebar-link').forEach(l => {
                         if(l.id !== 'nav-mailbox') l.classList.remove('active');
                    });
                     // Maybe highlight mailbox briefly? Or just open modal.
                    return; 
                }
                
                document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
                clickedLink.classList.add('active');
                const panelName = clickedLink.id.replace('nav-', '');
                loadPanel(panelName);
            });
        });

        // Modal close listeners
        if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeDailyPlan);
        if (dailyPlanModal) dailyPlanModal.addEventListener('click', (e) => {
            if (e.target === dailyPlanModal) closeDailyPlan();
        });

        loadPanel('dashboard'); // Load initial panel
        
        // AI Copilot setup
        if (chatInput && sendButton) {
            sendButton.addEventListener('click', handleSendMessage);
            chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSendMessage(); });
            addMessageToChat("Hello! I'm your AI Copilot. Enter a stock ticker for a deep-dive analysis.");
        } else {
             console.error("Chat input or send button not found.");
        }
    });
</script>
</body>
</html>
