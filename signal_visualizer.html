<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Mercury - Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-glass: rgba(10, 10, 15, 0.6); --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f9fafb; --text-secondary: #a1a1aa; --accent-primary: #aaa;
            --accent-green: #34d399; --accent-red: #fb7185;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1657978837950-03646a7c7b9e?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=2832');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-primary);
        }
        .floating-panel {
            background-color: var(--bg-glass);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid var(--border-color);
            box-shadow: 0 16px 60px 0 rgba(0, 0, 0, 0.5);
        }
        .widget-title {
            font-weight: 500; color: var(--text-secondary); margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;
            font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .sidebar-link.active { color: var(--accent-primary); background-color: rgba(255,255,255,0.05); }
        .ai-chat-bubble { border: 1px solid var(--border-color); background: rgba(30, 41, 59, 0.6); }
        .ai-chat-bubble.user { background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.3); }
        .prose { color: var(--text-primary); }
        .prose h3 { color: var(--text-primary); }
        .prose strong { color: var(--text-primary); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-black">

    <div class="w-[95vw] h-[90vh] max-w-screen-2xl flex items-center gap-6">
        <!-- NAV Sidebar -->
        <nav class="floating-panel rounded-2xl flex-col items-center py-6 px-3 space-y-6 hidden sm:flex">
            <div class="w-10 h-10 bg-[var(--accent-primary)] rounded-lg flex items-center justify-center font-bold text-black text-xl">M</div>
            <a href="#" id="nav-dashboard" class="sidebar-link active p-3 rounded-lg" title="Dashboard (D)"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg></a>
            <a href="#" id="nav-positions" class="sidebar-link p-3 text-slate-400 hover:text-white rounded-lg" title="Positions (P)"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M12 14a3 3 0 100-6 3 3 0 000 6z"></path></svg></a>
            <a href="#" id="nav-history" class="sidebar-link p-3 text-slate-400 hover:text-white rounded-lg" title="Trade History (H)"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></a>
            <a href="#" id="nav-analytics" class="sidebar-link p-3 text-slate-400 hover:text-white rounded-lg" title="Analytics (A)"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" /><path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" /></svg></a>
            <a href="#" id="nav-research" class="sidebar-link p-3 text-slate-400 hover:text-white rounded-lg" title="Research (R)"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.37 3.414-1.414 3.414H4.828c-1.784 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg></a>
        </nav>

        <!-- Main Content Area -->
        <main class="floating-panel rounded-2xl flex-1 h-full flex flex-col">
            <div id="main-content" class="p-6 overflow-y-auto flex-1">
                <!-- Content will be dynamically injected by JavaScript -->
            </div>
        </main>
        
        <!-- AI Copilot Sidebar -->
        <aside class="floating-panel rounded-2xl w-full max-w-md h-full flex-col hidden lg:flex">
             <div class="p-4 border-b border-[var(--border-color)] flex justify-between items-center"><h2 class="text-xl font-semibold text-white">Gemini AI Copilot</h2></div>
             <div id="chat-window" class="flex-1 p-4 space-y-4 overflow-y-auto"></div>
             <div class="p-4 border-t border-[var(--border-color)]"><div class="flex space-x-2"><input type="text" id="chat-input" class="flex-1 bg-slate-800/50 border border-[var(--border-color)] rounded-lg px-4 py-2" placeholder="Type a ticker for a deep dive..."><button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Send</button></div></div>
        </aside>
    </div>

<script>
    // --- UTILITY FUNCTIONS ---
    const formatCurrency = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
    const formatPercent = (val) => `${(val * 100).toFixed(2)}%`;
    const formatNumber = (val) => new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val);

    async function fetchData(endpoint, options = {}) {
        try {
            const res = await fetch(endpoint, options);
            if (!res.ok) { 
                const errorData = await res.json().catch(() => ({error: 'Failed to fetch'}));
                throw new Error(errorData.error);
            }
            return await res.json();
        } catch (error) {
            console.error(`Fetch error for ${endpoint}:`, error);
            throw error;
        }
    }

    // --- TEMPLATES FOR SPA ---
    const panelTemplates = {
        dashboard: `
            <div class="space-y-6">
                <header><h1 class="text-3xl font-bold text-white">Dashboard</h1></header>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-1 space-y-6">
                        <div><h3 class="widget-title">Portfolio Summary</h3><div id="portfolio-summary"></div></div>
                        <div><h3 class="widget-title">Live Equity Curve</h3><div id="equity-curve-chart" class="w-full h-40"></div></div>
                    </div>
                    <div class="lg:col-span-2"><h3 class="widget-title">Signal Watchlist</h3><div id="watchlist-grid"></div></div>
                </div>
            </div>`,
        positions: `<div class="space-y-6"><header><h1 class="text-3xl font-bold text-white">Open Positions</h1></header><div class="overflow-y-auto"><table class="w-full text-left text-sm"><thead class="sticky top-0 bg-[var(--bg-glass)] backdrop-blur-md"><tr><th class="p-3">Symbol</th><th>Qty</th><th>Avg Entry</th><th>Current Price</th><th>Unrealized P/L</th></tr></thead><tbody id="positions-table-body"></tbody></table></div></div>`,
        history: `<div class="space-y-6"><header><h1 class="text-3xl font-bold text-white">Trade History</h1></header><div class="overflow-y-auto"><table class="w-full text-left text-sm"><thead class="sticky top-0 bg-[var(--bg-glass)] backdrop-blur-md"><tr><th class="p-3">Timestamp</th><th>Symbol</th><th>Action</th><th>Qty</th><th>Price</th><th>Type</th></tr></thead><tbody id="history-table-body"></tbody></table></div></div>`,
        analytics: `<div class="space-y-6"><header><h1 class="text-3xl font-bold text-white">Performance Analytics</h1></header><div id="analytics-content"></div></div>`,
        research: `
            <div class="space-y-6">
                <header><h1 class="text-3xl font-bold text-white">Backtesting & Research</h1></header>
                <div>
                    <h3 class="widget-title">Run New Backtest</h3>
                    <div class="bg-slate-800/20 p-4 rounded-lg grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                        <div>
                            <label for="ticker-input" class="block text-sm font-medium text-slate-300">Ticker</label>
                            <input type="text" id="ticker-input" value="SPY" class="mt-1 block w-full bg-slate-700/50 border border-[var(--border-color)] rounded-md py-2 px-3 text-sm">
                        </div>
                        <div>
                            <label for="strategy-select" class="block text-sm font-medium text-slate-300">Strategy</label>
                            <select id="strategy-select" class="mt-1 block w-full bg-slate-700/50 border border-[var(--border-color)] rounded-md py-2 px-3 text-sm"><option>SmaCross</option></select>
                        </div>
                        <button id="run-backtest-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg h-10">Run</button>
                    </div>
                </div>
                <div><h3 class="widget-title">Backtest History</h3><div class="overflow-y-auto"><table class="w-full text-left text-sm"><thead class="sticky top-0 bg-[var(--bg-glass)] backdrop-blur-md"><tr><th class="p-3">Strategy</th><th>Sharpe</th><th>CAGR</th><th>Max Drawdown</th><th>Timestamp</th><th>Report</th></tr></thead><tbody id="backtest-results-body"></tbody></table></div></div>
            </div>`
    };

    const mainContent = document.getElementById('main-content');
    let equityChart = null;

    // --- RENDER FUNCTIONS (FULLY IMPLEMENTED) ---
    function renderPortfolioSummary(element, data) {
        const totalPL = data.positions.reduce((acc, p) => acc + parseFloat(p.unrealized_pl), 0);
        element.innerHTML = `<div class="space-y-2 text-sm">
            <div class="flex justify-between items-baseline"><span class="text-slate-400">Equity</span><span class="font-mono text-lg">${formatCurrency(data.portfolio_value)}</span></div>
            <div class="flex justify-between items-baseline"><span class="text-slate-400">Cash</span><span class="font-mono text-lg">${formatCurrency(data.cash)}</span></div>
            <div class="flex justify-between items-baseline"><span class="text-slate-400">Positions</span><span class="font-mono text-lg">${data.positions.length}</span></div>
            <div class="flex justify-between items-baseline"><span class="text-slate-400">Today's P/L</span><span class="font-mono text-lg ${totalPL >= 0 ? 'text-green-400' : 'text-red-400'}">${formatCurrency(totalPL)}</span></div>
        </div>`;
    }
    
    function renderEquityCurve(element, data) {
        if (equityChart) equityChart.remove();
        element.innerHTML = '';
        equityChart = LightweightCharts.createChart(element, { width: element.clientWidth, height: 160, layout: { background: { type: 'solid', color: 'transparent' }, textColor: 'var(--text-primary)' }, grid: { vertLines: { visible: false }, horzLines: { color: 'rgba(255, 255, 255, 0.1)' } } });
        const lineSeries = equityChart.addLineSeries({ color: 'var(--accent-primary)', lineWidth: 2 });
        lineSeries.setData(data);
        equityChart.timeScale().fitContent();
    }

    function renderWatchlist(element, data) {
        if (data.length === 0) {
            element.innerHTML = `<div class="text-center p-4 rounded-lg bg-slate-800/30"><p>No signals generated for today.</p></div>`;
            return;
        }
        element.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">${data.map(item => `
            <div class="bg-slate-800/20 border border-[var(--border-color)] p-3 rounded-lg">
                <div class="flex justify-between items-center"><h3 class="font-bold">${item.ticker}</h3><span class="font-mono text-sm">${formatCurrency(item.last_close || 0)}</span></div>
                <div class="mt-3 flex justify-between items-center text-xs">
                    <span class="font-semibold ${item.sentiment_label === 'Positive' ? 'text-green-400' : item.sentiment_label === 'Negative' ? 'text-red-400' : 'text-gray-400'}">${item.sentiment_label || 'Neutral'}</span>
                    <span class="font-bold px-2 py-1 rounded-md ${item.live_signal?.includes('BUY') ? 'bg-green-600/80 text-white' : 'bg-slate-700/80 text-gray-300'}">${(item.live_signal || 'NONE').replace('_', ' ')}</span>
                </div>
            </div>`).join('')}</div>`;
    }

    function renderPositions(element, data) {
        if (data.length === 0) {
            element.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No open positions.</td></tr>`;
            return;
        }
        element.innerHTML = data.map(p => {
            const pnl = parseFloat(p.unrealized_pl);
            return `<tr class="border-b border-[var(--border-color)]">
                <td class="p-3 font-bold">${p.symbol}</td><td class="p-3 font-mono">${formatNumber(p.qty)}</td>
                <td class="p-3 font-mono">${formatCurrency(p.avg_entry_price)}</td><td class="p-3 font-mono">${formatCurrency(p.current_price)}</td>
                <td class="p-3 font-mono ${pnl >= 0 ? 'text-green-400' : 'text-red-400'}">${formatCurrency(pnl)}</td></tr>`;
        }).join('');
    }

    function renderHistory(element, trades) {
        if (trades.length === 0) {
            element.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">No trade history found.</td></tr>`;
            return;
        }
        element.innerHTML = trades.map(t => `<tr class="border-b border-[var(--border-color)]">
            <td class="p-3 font-mono text-xs">${new Date(t.timestamp).toLocaleString()}</td><td class="p-3 font-bold">${t.ticker}</td>
            <td class="p-3 ${t.action === 'BUY' ? 'text-green-400' : 'text-red-400'}">${t.action}</td><td class="p-3 font-mono">${formatNumber(t.quantity)}</td>
            <td class="p-3 font-mono">${formatCurrency(t.price)}</td><td class="p-3 text-slate-400">${t.trade_type}</td></tr>`).join('');
    }

    function renderAnalytics(element, stats) {
        if (stats.error) {
             element.innerHTML = `<div class="grid grid-cols-1"><p class="text-center text-amber-400 p-4">${stats.error}</p></div>`;
             return;
        }
        element.innerHTML = `<div class="grid grid-cols-2 md:grid-cols-3 gap-4">${Object.entries(stats).map(([key, value]) => {
            const formattedKey = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            let formattedValue;
            if (['net_pnl','avg_win','avg_loss','max_drawdown'].includes(key)) { formattedValue = formatCurrency(value); }
            else if (key.includes('rate') || key.includes('cagr')) { formattedValue = formatPercent(value); }
            else { formattedValue = formatNumber(value); }
            return `<div class="bg-slate-800/30 p-4 rounded-lg"><p class="text-sm text-slate-400">${formattedKey}</p><p class="text-2xl font-bold font-mono">${formattedValue}</p></div>`;
        }).join('')}</div>`;
    }
    
    function renderBacktestResults(element, results) {
        if (!results || results.length === 0) {
            element.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">No backtest results yet.</td></tr>`;
            return;
        }
        element.innerHTML = results.map(r => `
            <tr class="border-b border-[var(--border-color)]">
                <td class="p-3 font-bold">${r.strategy_name}</td>
                <td class="font-mono ${r.sharpe_ratio > 1 ? 'text-green-400' : 'text-slate-300'}">${formatNumber(r.sharpe_ratio)}</td>
                <td class="font-mono">${formatPercent(r.cagr)}</td>
                <td class="font-mono text-red-400">${formatPercent(r.max_drawdown)}</td>
                <td class="font-mono text-xs text-slate-400">${new Date(r.timestamp).toLocaleString()}</td>
                <td><a href="/${r.report_url}" target="_blank" class="text-sm text-blue-400 hover:underline">View Report</a></td>
            </tr>
        `).join('');
    }
    
    // --- AI CHATBOT & NAVIGATION ---
    const chatWindow = document.getElementById('chat-window');
    const chatInput = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-button');

    function addMessageToChat(content, isUser = false) {
        const bubble = document.createElement('div');
        bubble.className = `ai-chat-bubble p-3 rounded-lg max-w-full ${isUser ? 'user' : ''}`;
        bubble.innerHTML = isUser ? `<p class="text-white text-right">${content}</p>` : marked.parse(content);
        chatWindow.appendChild(bubble);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function handleSendMessage() {
        const message = chatInput.value.trim();
        if (!message) return;
        addMessageToChat(message, true);
        chatInput.value = '';
        addMessageToChat('<div class="italic text-slate-400">Gemini is thinking...</div>');
        try {
            const response = await fetchData('/api/ai/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
            chatWindow.removeChild(chatWindow.lastChild);
            addMessageToChat(response.reply);
        } catch (error) {
            chatWindow.removeChild(chatWindow.lastChild);
            addMessageToChat(`<div class="text-red-400">Error: ${error.message}</div>`);
        }
    }
    
    async function fetchAndRender(elementId, endpoint, renderer) {
        const element = document.getElementById(elementId);
        if (!element) return;
        element.innerHTML = '<p class="text-slate-400 text-center py-4">Loading...</p>';
        try {
            const data = await fetchData(endpoint);
            renderer(element, data);
        } catch (error) {
            element.innerHTML = `<p class="text-red-400 text-center py-4">Error: ${error.message}</p>`;
        }
    }

    function loadPanel(panelName) {
        mainContent.innerHTML = panelTemplates[panelName];
        if (panelName === 'dashboard') {
            fetchAndRender('portfolio-summary', '/api/portfolio_status', renderPortfolioSummary);
            fetchAndRender('equity-curve-chart', '/api/equity_curve', renderEquityCurve);
            fetchAndRender('watchlist-grid', '/api/dashboard_data', renderWatchlist);
        } else if (panelName === 'positions') {
            fetchAndRender('positions-table-body', '/api/portfolio_status', (elem, data) => renderPositions(elem, data.positions));
        } else if (panelName === 'history') {
            fetchAndRender('history-table-body', '/api/trade_history', renderHistory);
        } else if (panelName === 'analytics') {
            fetchAndRender('analytics-content', '/api/performance_stats', renderAnalytics);
        } else if (panelName === 'research') {
            fetchAndRender('backtest-results-body', '/api/research/backtest_results', renderBacktestResults);
            // In a real app you would populate this dynamically
            // document.getElementById('run-backtest-btn').addEventListener('click', handleRunBacktest); 
        }
    }

    // --- MAIN INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.sidebar-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                const panelName = link.id.replace('nav-', '');
                loadPanel(panelName);
            });
        });
        loadPanel('dashboard');
        sendButton.addEventListener('click', handleSendMessage);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSendMessage(); });
        addMessageToChat("Hello! I'm your AI Copilot. Enter a stock ticker for a deep-dive analysis.");
    });
</script>
</body>
</html>
